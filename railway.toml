# Railway configuration for the ConvexPi grader service.
# Requires a reachable Docker daemon with shared temporary paths; see deploy/SECURITY.md.
# A Railway worker without that execution boundary now fails closed.
#
# Required env vars (set in Railway dashboard → Variables):
#   NEXT_PUBLIC_SUPABASE_URL  — Supabase project URL
#   SUPABASE_SERVICE_KEY      — Service role key (bypasses RLS)
#   MARKET_SEED               — Secret integer seed for the hidden OOS market
#   GRADER_DOCKER_IMAGE       — Prebuilt credential-free sandbox image
#
# Optional:
#   MARKET_N_STOCKS           — default 200
#   MARKET_N_DAYS             — default 1260
#   GRADE_TIMEOUT             — default 60
#   MAX_SUBMISSIONS_PER_RUN   — default 20; remaining work waits for the next cron run
#   DISCORD_WEBHOOK_URL       — post grade results to a Discord channel
#   SENTRY_DSN                — error monitoring

[build]
dockerfilePath = "deploy/Dockerfile.grader"

[deploy]
startCommand = "python deploy/grader_worker.py --once"
# No Railway schedule: this platform has no isolated Docker runtime. Schedule
# deploy/compose.yaml on the dedicated host using deploy/systemd instead.
restartPolicyType = "NEVER"
