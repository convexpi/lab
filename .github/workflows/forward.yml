name: Forward paper-trading

on:
  workflow_dispatch:

jobs:
  forward-run:
    # Production scoring has moved to a dedicated Docker host. Retain this
    # historical workflow for reference without executing an application queue.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install convexpi-lab
        run: pip install -e ".[deploy]"

      - name: Build isolated strategy runtime
        run: docker build -f deploy/Dockerfile.sandbox -t convexpi-sandbox:local .
      - name: Run forward evaluator
        env:
          GRADER_DOCKER_IMAGE: convexpi-sandbox:local
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:     ${{ secrets.SUPABASE_SERVICE_KEY }}
          MARKET_SEED_BASE:         ${{ secrets.MARKET_SEED_BASE }}
          DISCORD_WEBHOOK_URL:  ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORWARD_WINDOW_DAYS:  "60"
          FORWARD_N_STOCKS:     "100"
        run: python deploy/forward_runner.py
